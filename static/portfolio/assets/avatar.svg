<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12121a"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7000ff"/>
      <stop offset="1" stop-color="#ff00aa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- 网格背景 -->
  <g stroke="rgba(0,240,255,.05)" stroke-width="1">
    <path d="M0 100h400M0 200h400M0 300h400M100 0v400M200 0v400M300 0v400"/>
  </g>
  <!-- 装饰光斑 -->
  <circle cx="320" cy="80" r="70" fill="rgba(0,240,255,.10)"/>
  <circle cx="70" cy="330" r="60" fill="rgba(112,0,255,.12)"/>
  <!-- 终端窗口 -->
  <g filter="url(#glow)">
    <rect x="70" y="110" width="260" height="180" rx="14" fill="#0a0a0f" stroke="rgba(0,240,255,.35)" stroke-width="1.5"/>
    <rect x="70" y="110" width="260" height="30" rx="14" fill="rgba(0,240,255,.08)"/>
    <line x1="70" y1="140" x2="330" y2="140" stroke="rgba(0,240,255,.35)" stroke-width="1.5"/>
    <circle cx="88" cy="125" r="4" fill="#ff00aa"/>
    <circle cx="102" cy="125" r="4" fill="#7000ff"/>
    <circle cx="116" cy="125" r="4" fill="#00f0ff"/>
    <!-- 代码行 -->
    <rect x="88" y="158" width="52" height="8" rx="4" fill="url(#cyan)"/>
    <rect x="148" y="158" width="90" height="8" rx="4" fill="rgba(255,255,255,.18)"/>
    <rect x="88" y="178" width="34" height="8" rx="4" fill="url(#purple)"/>
    <rect x="130" y="178" width="110" height="8" rx="4" fill="rgba(255,255,255,.18)"/>
    <rect x="88" y="198" width="70" height="8" rx="4" fill="rgba(0,240,255,.5)"/>
    <rect x="166" y="198" width="60" height="8" rx="4" fill="rgba(255,255,255,.18)"/>
    <rect x="88" y="218" width="44" height="8" rx="4" fill="rgba(255,0,170,.6)"/>
    <rect x="140" y="218" width="96" height="8" rx="4" fill="rgba(255,255,255,.18)"/>
    <rect x="88" y="238" width="58" height="8" rx="4" fill="rgba(112,0,255,.6)"/>
    <rect x="154" y="238" width="80" height="8" rx="4" fill="rgba(255,255,255,.18)"/>
    <!-- 光标 -->
    <rect x="88" y="258" width="10" height="12" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- 底部标识 -->
  <text x="200" y="340" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="url(#cyan)">&lt;/&gt; 土豆</text>
</svg>
